<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obramat - Gestión de Propuestas (Calendario)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --obramat-yellow: #FFCC00;
            --obramat-dark: #1A1C1E;
            --obramat-grey: #F4F5F7;
            --border-color: #E2E8F0;
            --text-main: #333333;
            --text-muted: #666666;
            --white: #FFFFFF;
            --danger: #E53935;
            --success: #2E7D32;
            --pending: #F57C00;
            --request-blue: #0056b3;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--obramat-grey);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* Cabecera Corporativa */
        .navbar {
            background-color: var(--obramat-dark);
            color: var(--white);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 5px solid var(--obramat-yellow);
            flex-shrink: 0;
        }

        .navbar-brand {
            text-decoration: none;
            color: white;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .section-header {
            padding: 15px 40px;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9em;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--obramat-dark); }

        h2 {
            margin: 0;
            font-weight: 900;
            color: var(--obramat-dark);
            font-size: 20px;
            text-transform: uppercase;
        }

        /* Layout Principal */
        .layout-wrapper {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 15px;
            gap: 15px;
        }

        /* Panel Izquierdo: Calendario */
        .calendar-panel {
            flex: 3;
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .calendar-header {
            padding: 15px;
            background-color: var(--obramat-dark);
            color: var(--white);
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
        }

        .calendar-wrapper {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        table.calendar-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .calendar-table th.day-col {
            background-color: var(--obramat-grey);
            color: var(--obramat-dark);
            padding: 12px 5px;
            font-size: 0.85em;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            width: 20%; 
        }

        .calendar-table td.drop-zone-cell {
            border: 1px solid var(--border-color);
            height: 100px; 
            vertical-align: top;
            padding: 6px;
            background-color: var(--white);
            transition: background-color 0.2s;
        }

        .calendar-table td.drop-zone-cell.drag-over {
            background-color: #E3F2FD;
            border: 2px dashed #2196F3;
        }

        .time-col {
            width: 70px;
            background-color: #FAFAFA;
            font-weight: 700;
            color: var(--text-muted);
            text-align: center;
            vertical-align: middle !important;
            font-size: 0.8em;
            border-bottom: 1px solid var(--border-color);
        }

        /* Panel Derecho: Lista de Propuestas */
        .sidebar-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            background: var(--white);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 15px;
            background-color: var(--obramat-yellow);
            color: var(--obramat-dark);
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background-color: #F9FAFC;
        }

        /* Tarjetas Arrastrables */
        .proposal-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid var(--obramat-yellow);
            display: block;
        }

        .proposal-card:active {
            cursor: grabbing;
            transform: scale(0.98);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .proposal-card .ref-header {
            font-family: monospace;
            font-weight: 900;
            color: var(--obramat-dark);
            font-size: 1.05em;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .proposal-card .prov-name {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 600;
            pointer-events: none;
        }

        /* Estilo para la nueva información de hora solicitada */
        .proposal-card .req-time-info {
            font-size: 0.8em;
            color: var(--request-blue);
            margin-bottom: 10px;
            font-weight: 700;
            background: #E3F2FD;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            pointer-events: none;
        }

        .proposal-card .actions {
            display: flex;
            gap: 8px;
        }

        .btn-card {
            flex: 1;
            padding: 6px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.7em;
            cursor: pointer;
            text-transform: uppercase;
            border: none;
            transition: 0.2s;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-detalle { background: var(--obramat-grey); color: var(--obramat-dark); border: 1px solid #CCC; }
        .btn-detalle:hover { background: #E2E8F0; }
        
        .btn-cancelar { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-cancelar:hover { background: var(--danger); color: white; }

        /* Estilo de la tarjeta MINIMIZADA en el calendario */
        .proposal-card.placed {
            margin-bottom: 6px;
            padding: 8px 10px;
            border-left-color: var(--success);
            background-color: #E8F5E9;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: auto;
        }
        
        .proposal-card.placed:last-child { margin-bottom: 0; }
        .proposal-card.placed .ref-header { font-size: 0.9em; margin-bottom: 0; }
        .proposal-card.placed .ref-header span:last-child { display: none; }
        .proposal-card.placed .prov-name { display: none; }
        .proposal-card.placed .req-time-info { display: none; } /* Ocultar hora solicitada en el calendario */
        .proposal-card.placed .actions { display: none; } 
        
        .proposal-card.placed .placed-actions {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
            padding: 0;
            color: var(--text-muted);
        }
        .btn-icon:hover { color: var(--obramat-dark); transform: scale(1.2); }

        /* Modales */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; width: 95%; max-width: 800px; text-align: center; }
        .detalle-table { width: 100%; border-collapse: collapse; font-size: 0.85em; margin: 20px 0; }
        .detalle-table th { background: var(--obramat-grey); padding: 10px; border: 1px solid var(--border-color); }
        .detalle-table td { padding: 8px; border: 1px solid var(--border-color); }
        .sumatorio-box { background: #E8F5E9; padding: 15px; border-radius: 6px; display: flex; justify-content: space-around; font-weight: bold; }
        .btn-close-modal { background: var(--obramat-dark); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Montserrat'; font-weight: 700;}

    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="navbar-brand">OBRAMAT</a>
    <div style="font-size: 0.8em; font-weight: 600;">Centro Logístico - Planificación Semanal</div>
</nav>

<div class="section-header">
    <div class="header-title-group">
        <a href="index.html" class="back-link">← Volver al Menú Principal</a>
        <h2>Planificador de Citas Logísticas</h2>
    </div>
</div>

<div class="layout-wrapper">
    <div class="calendar-panel">
        <div class="calendar-header" id="calendarWeekLabel">
            SEMANA ACTUAL (LUNES A VIERNES)
        </div>
        <div class="calendar-wrapper">
            <table class="calendar-table" id="calendarTable">
                <thead>
                    <tr id="calendarDaysHeader">
                        <th class="time-col" style="position: sticky; left: 0; z-index: 11;">Hora</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="sidebar-panel">
        <div class="sidebar-header">
            <span>PENDIENTES DE ASIGNAR</span>
            <span id="pendingCount" style="background: white; color: var(--obramat-dark); padding: 2px 8px; border-radius: 12px; font-size: 0.8em;">0</span>
        </div>
        <div class="sidebar-list" id="pendingList" ondragover="allowDrop(event)" ondrop="dropToSidebar(event)">
        </div>
    </div>
</div>

<div id="modalDetalle" class="modal-overlay">
    <div class="modal-content">
        <h3>Desglose de Propuesta <span id="modalRef" style="color:var(--danger)"></span></h3>
        <div id="modalTableContainer" style="max-height: 50vh; overflow-y: auto;"></div>
        <div class="sumatorio-box" id="modalSumatorio"></div>
        <button class="btn-close-modal" style="margin-top:20px;" onclick="cerrarDetalles()">Cerrar Detalle</button>
    </div>
</div>

<script>
    // --- DATOS SIMULADOS ---
    let propuestasPendientes = [];
    const proveedores = ["ROCA SANITARIO", "CEYS SL", "BOSCH TOOLS", "MAKITA ESPAÑA", "FISCHER DAREX", "CERAMICAS GALA", "PINTURAS MONTO"];
    const secciones = ["HERRAMIENTAS", "ELECTRICIDAD", "SANITARIO", "MADERA", "FONTANERIA", "PINTURA", "MATERIALES", "FERRETERIA", "CERAMICA"];
    const almacenes = ["012 Usera", "011 Majadahonda", "007 Rivas"];

    function initData() {
        for(let i = 1; i <= 25; i++) {
            const numPedidos = Math.floor(Math.random() * 5) + 2; 
            const pedidosGenerados = [];

            for(let j = 0; j < numPedidos; j++) {
                pedidosGenerados.push({
                    id: "1804" + i + "0" + j,
                    sec: secciones[Math.floor(Math.random() * secciones.length)],
                    alm: almacenes[Math.floor(Math.random() * almacenes.length)],
                    c1: Math.floor(Math.random() * 4), 
                    c2: Math.floor(Math.random() * 2), 
                    p1: Math.floor(Math.random() * 2), 
                    p2: Math.floor(Math.random() * 3), 
                    p3: Math.floor(Math.random() * 2), 
                    p4: 0, 
                    p5: 0
                });
            }

            // --- NUEVA LÓGICA: Generar hora solicitada aleatoria (07:00 - 16:00) ---
            const horaAleatoria = Math.floor(Math.random() * (16 - 7 + 1)) + 7;
            const minutoAleatorio = Math.random() < 0.5 ? "00" : "30";
            const horaSolicitada = `${String(horaAleatoria).padStart(2, '0')}:${minutoAleatorio}`;

            propuestasPendientes.push({
                ref: `REF-${2026100 + i}`,
                prov: proveedores[i % proveedores.length],
                pedidos: pedidosGenerados,
                horaSolicitada: horaSolicitada
            });
        }
    }

    const diasSemana = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
    
    function renderCalendar() {
        const headerTr = document.getElementById('calendarDaysHeader');
        diasSemana.forEach((dia) => {
            const th = document.createElement('th');
            th.innerText = dia;
            th.className = 'day-col';
            headerTr.appendChild(th);
        });

        const tbody = document.getElementById('calendarBody');
        for (let h = 7; h <= 16; h++) {
            const timeStr = `${String(h).padStart(2, '0')}:00`;
            const tr = document.createElement('tr');
            const tdTime = document.createElement('td');
            tdTime.className = 'time-col';
            tdTime.innerText = timeStr;
            tr.appendChild(tdTime);

            diasSemana.forEach((dia, index) => {
                const td = document.createElement('td');
                td.className = 'drop-zone-cell';
                td.id = `slot-${index}-${timeStr}`; 
                td.ondragover = allowDrop;
                td.ondragenter = dragEnter;
                td.ondragleave = dragLeave;
                td.ondrop = drop;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }
    }

    function renderSidebar() {
        const list = document.getElementById('pendingList');
        list.innerHTML = '';
        document.getElementById('pendingCount').innerText = propuestasPendientes.length;

        propuestasPendientes.forEach(item => {
            const card = document.createElement('div');
            card.className = 'proposal-card';
            card.id = item.ref;
            card.draggable = true;
            card.ondragstart = drag;

            const totalPed = item.pedidos.length;

            card.innerHTML = `
                <div class="ref-header">
                    <span>${item.ref}</span>
                    <span style="font-size:0.7em; color:var(--pending)">☰</span>
                </div>
                <div class="prov-name">${item.prov} (${totalPed} pedidos)</div>
                
                <div class="req-time-info">Solicita descargar: ${item.horaSolicitada}</div>
                
                <div class="actions">
                    <button class="btn-card btn-detalle" onclick="verDetalle('${item.ref}')">🔍 Detalle</button>
                    <button class="btn-card btn-cancelar" onclick="cancelarPropuesta('${item.ref}')">✖ Cancelar</button>
                </div>

                <div class="placed-actions" style="display:none;">
                    <button class="btn-icon" title="Ver Detalle" onclick="verDetalle('${item.ref}')">🔍</button>
                    <button class="btn-icon" title="Devolver a Pendientes" onclick="devolverSidebar('${item.ref}')">↺</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function drag(ev) {
        ev.dataTransfer.setData("text", ev.currentTarget.id);
        ev.currentTarget.style.opacity = "0.5";
    }

    function allowDrop(ev) { ev.preventDefault(); }

    function dragEnter(ev) {
        ev.preventDefault();
        const dropZone = ev.target.closest('.drop-zone-cell') || ev.target.closest('.sidebar-list');
        if(dropZone && dropZone.classList.contains('drop-zone-cell')) dropZone.classList.add('drag-over');
    }

    function dragLeave(ev) {
        const dropZone = ev.target.closest('.drop-zone-cell');
        if(dropZone) dropZone.classList.remove('drag-over');
    }

    function drop(ev) {
        ev.preventDefault();
        const dropZone = ev.target.closest('.drop-zone-cell');
        if(dropZone) {
            dropZone.classList.remove('drag-over');
            const data = ev.dataTransfer.getData("text");
            const el = document.getElementById(data);
            if(!el) return;
            el.style.opacity = "1";

            const currentCards = dropZone.querySelectorAll('.proposal-card').length;
            const isAlreadyHere = el.parentElement === dropZone;

            if(!isAlreadyHere && currentCards >= 2) {
                alert("Esta celda ya está llena (Máximo 2 propuestas por hora).");
                return;
            }

            el.classList.add('placed');
            el.querySelector('.actions').style.display = 'none';
            el.querySelector('.prov-name').style.display = 'none';
            el.querySelector('.req-time-info').style.display = 'none'; // Ocultar al colocar
            el.querySelector('.placed-actions').style.display = 'flex';
            
            dropZone.appendChild(el);
            actualizarContadorSidebar();
        }
    }

    function dropToSidebar(ev) {
        ev.preventDefault();
        const data = ev.dataTransfer.getData("text");
        devolverSidebar(data);
    }

    function devolverSidebar(refId) {
        const el = document.getElementById(refId);
        if(el) {
            el.classList.remove('placed');
            el.style.opacity = "1";
            el.querySelector('.actions').style.display = 'flex';
            el.querySelector('.prov-name').style.display = 'block';
            el.querySelector('.req-time-info').style.display = 'inline-block'; // Mostrar de nuevo
            el.querySelector('.placed-actions').style.display = 'none';
            document.getElementById('pendingList').appendChild(el);
            actualizarContadorSidebar();
        }
    }

    function actualizarContadorSidebar() {
        const count = document.getElementById('pendingList').querySelectorAll('.proposal-card').length;
        document.getElementById('pendingCount').innerText = count;
    }

    function cancelarPropuesta(ref) {
        if(confirm(`¿Estás seguro de que quieres cancelar y eliminar la propuesta ${ref}?`)) {
            propuestasPendientes = propuestasPendientes.filter(x => x.ref !== ref);
            const el = document.getElementById(ref);
            if(el) el.remove();
            actualizarContadorSidebar();
        }
    }

    function verDetalle(ref) {
        const item = propuestasPendientes.find(x => x.ref === ref);
        if(!item) return;
        document.getElementById('modalRef').innerText = ref;
        let tB = 0, tP = 0;
        let h = `<table class="detalle-table"><thead><tr><th>Pedido</th><th>Sección</th><th>Almacén</th><th>C1</th><th>C2</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th></tr></thead><tbody>`;
        item.pedidos.forEach(p => {
            tB += (p.c1 + p.c2); tP += (p.p1 + p.p2 + p.p3 + p.p4 + p.p5);
            h += `<tr><td><strong>${p.id}</strong></td><td>${p.sec}</td><td>${p.alm}</td><td>${p.c1}</td><td>${p.c2}</td><td>${p.p1}</td><td>${p.p2}</td><td>${p.p3}</td><td>${p.p4}</td><td>${p.p5}</td></tr>`;
        });
        h += `</tbody></table>`;
        document.getElementById('modalTableContainer').innerHTML = h;
        document.getElementById('modalSumatorio').innerHTML = `<div>Total Bultos: <span style="color:var(--danger)">${tB}</span></div><div>Total Palets: <span style="color:var(--danger)">${tP}</span></div>`;
        document.getElementById('modalDetalle').classList.add('active');
    }

    function cerrarDetalles() { document.getElementById('modalDetalle').classList.remove('active'); }

    window.onload = () => {
        initData();
        renderCalendar();
        renderSidebar();
    };

    document.addEventListener('dragend', function(event) {
        if(event.target.classList.contains('proposal-card')) event.target.style.opacity = "1";
    });
</script>
</body>
</html>
